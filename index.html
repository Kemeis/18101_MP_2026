<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>18101_MP_2026</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #111;
    }

    #panorama {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    .menu-panel {
      position: absolute;
      z-index: 30;
      background: rgba(242, 242, 242, 0.97);
      border-radius: 12px;
      padding: 10px;
      min-width: 250px;
      max-width: calc(100vw - 24px);
      box-shadow: 0 6px 22px rgba(0,0,0,0.28);
      display: none;
      color: #333;
    }

    .menu-panel button,
    .hamburger-btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e7e7e7;
      color: #333;
      font-size: 14px;
    }

    .menu-panel button {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 11px 12px;
      text-align: left;
    }

    .menu-panel button:hover,
    .hamburger-btn:hover {
      background: #d7d7d7;
    }

    .hamburger-wrap {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 35;
    }

    .hamburger-btn {
      width: 56px;
      height: 56px;
      font-size: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.28);
      background: rgba(242, 242, 242, 0.96);
    }

    @media (max-width: 768px) {
      .menu-panel {
        right: 12px !important;
        left: 12px !important;
        bottom: 84px !important;
        top: auto !important;
        min-width: auto;
        width: auto;
      }

      .menu-panel button {
        font-size: 16px;
        padding: 13px 14px;
      }

      .hamburger-btn {
        width: 60px;
        height: 60px;
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

<div id="panorama"></div>
<div id="menuPanel" class="menu-panel"></div>

<div class="hamburger-wrap">
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">☰</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.105.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/pchen66/panolens.js@0.10.2/build/panolens.min.js"></script>

<script>
  const pano = new PANOLENS.ImagePanorama('b6.jpeg');

  const viewer = new PANOLENS.Viewer({
    container: document.getElementById('panorama'),
    controlBar: false,
    autoRotate: false,
    output: 'console'
  });

  viewer.add(pano);
  viewer.setPanorama(pano);

  function openHamburgerMenu() {
    const panel = document.getElementById('menuPanel');

    if (panel.style.display === 'block') {
      closeMenu();
      return;
    }

    panel.innerHTML = '';

    const items = [
      {
        label: 'Top view',
        action: () => window.open('b5.jpeg', '_blank')
      },
      {
        label: 'Bathroom floorplan draft',
        action: () => window.open('18101_MP_2026_Bathroom.pdf', '_blank')
      },
      {
        label: 'Full floorplan',
        action: () => window.open('18101_MP_2026.pdf', '_blank')
      },
      {
        label: 'Matterport scan',
        action: () => window.open('https://my.matterport.com/show/?m=MpEoLCzEUTo&ss=10&sr=-.25,.97', '_blank')
      },
      {
        label: 'Credentials',
        action: () => window.open('https://kemeis.github.io/Portfolio/', '_blank')
      }
    ];

    items.forEach(i => {
      const b = document.createElement('button');
      b.textContent = i.label;
      b.onclick = i.action;
      panel.appendChild(b);
    });

    if (window.innerWidth <= 768) {
      panel.style.left = '12px';
      panel.style.right = '12px';
      panel.style.bottom = '84px';
      panel.style.top = 'auto';
    } else {
      panel.style.right = '16px';
      panel.style.left = 'auto';
      panel.style.bottom = '84px';
      panel.style.top = 'auto';
    }

    panel.style.display = 'block';
  }

  function closeMenu() {
    document.getElementById('menuPanel').style.display = 'none';
  }

  document.getElementById('hamburgerBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    openHamburgerMenu();
  });

  window.viewer = viewer;
</script>

</body>
</html>
